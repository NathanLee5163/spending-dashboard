<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Organizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080c14;
      --bg-accent: #0f1729;
      --surface: rgba(20, 28, 46, 0.72);
      --surface-solid: #141c2e;
      --surface-hover: rgba(30, 42, 68, 0.9);
      --border: rgba(148, 163, 184, 0.12);
      --border-strong: rgba(148, 163, 184, 0.22);
      --text: #f1f5f9;
      --muted: #8b9cb8;
      --accent: #5b8def;
      --accent-glow: rgba(91, 141, 239, 0.25);
      --success: #34d399;
      --danger: #f87171;
      --sidebar-w: 280px;
      --radius: 14px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(91, 141, 239, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 90% 10%, rgba(52, 211, 153, 0.1), transparent),
        radial-gradient(ellipse 50% 30% at 50% 100%, rgba(139, 92, 246, 0.08), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .sidebar-header {
      padding: 1.5rem 1.25rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.35rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: grid;
      place-items: center;
      font-size: 1.1rem;
    }

    .logo h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .sidebar-header p {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      position: relative;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .file-list.dragover {
      background: rgba(91, 141, 239, 0.08);
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    .sidebar-drop-overlay {
      display: none;
      position: absolute;
      inset: 0.5rem;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      background: rgba(91, 141, 239, 0.1);
      z-index: 10;
      pointer-events: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
    }

    .file-list.dragover .sidebar-drop-overlay {
      display: flex;
    }

    .sidebar-drop-overlay svg {
      width: 28px;
      height: 28px;
      opacity: 0.8;
    }

    .file-list-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding: 0.5rem 0.5rem 0.35rem;
      font-weight: 600;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 0.75rem;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
      margin-bottom: 0.25rem;
      border: 1px solid transparent;
    }

    .file-item:hover {
      background: var(--surface-hover);
    }

    .file-item.active {
      background: rgba(91, 141, 239, 0.12);
      border-color: rgba(91, 141, 239, 0.3);
    }

    .file-item .file-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(91, 141, 239, 0.15);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 0.85rem;
    }

    .file-item.combined .file-icon {
      background: rgba(52, 211, 153, 0.15);
    }

    .file-item .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-item .file-name {
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-item .file-meta {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .file-remove {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0.25rem;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
      font-size: 1rem;
      line-height: 1;
    }

    .file-item:hover .file-remove {
      opacity: 1;
    }

    .file-remove:hover {
      color: var(--danger);
      background: rgba(248, 113, 113, 0.1);
    }

    .sidebar-empty {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.82rem;
      border: 2px dashed var(--border-strong);
      border-radius: 12px;
      margin: 0.25rem;
      transition: border-color 0.2s, background 0.2s;
    }

    .file-list.dragover .sidebar-empty {
      border-color: var(--accent);
      background: rgba(91, 141, 239, 0.06);
      color: var(--accent);
    }

    .sidebar-empty svg {
      width: 40px;
      height: 40px;
      opacity: 0.35;
      margin-bottom: 0.75rem;
    }

    .sidebar-empty .drop-hint {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      opacity: 0.75;
    }

    .sidebar-drop-prompt {
      margin-top: 0.5rem;
      padding: 0.85rem 0.75rem;
      border: 1px dashed var(--border-strong);
      border-radius: 10px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .file-list.dragover .sidebar-drop-prompt {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(91, 141, 239, 0.06);
    }

    .sidebar-footer {
      padding: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .add-file-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem;
      border: 1px dashed var(--border-strong);
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      font-family: inherit;
    }

    .add-file-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(91, 141, 239, 0.06);
    }

    /* ── Main ── */
    .main {
      flex: 1;
      min-width: 0;
      padding: 1.75rem 2rem 3rem;
      overflow-y: auto;
    }

    .main-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .main-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .main-header .subtitle {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 0.2rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    label.checkbox {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
      font-size: 0.82rem;
      cursor: pointer;
    }

    label.checkbox input {
      accent-color: var(--accent);
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 0.6rem 1.15rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #7c6df0);
      color: white;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px var(--accent-glow);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    /* ── Drop zone ── */
    .drop-zone {
      border: 2px dashed var(--border-strong);
      border-radius: var(--radius);
      padding: 3.5rem 2rem;
      text-align: center;
      background: var(--surface);
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 1.5rem;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(91, 141, 239, 0.06);
      box-shadow: 0 0 40px var(--accent-glow);
    }

    .drop-zone .dz-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 1rem;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(91,141,239,0.2), rgba(139,92,246,0.15));
      display: grid;
      place-items: center;
    }

    .drop-zone .dz-icon svg {
      width: 28px;
      height: 28px;
      color: var(--accent);
    }

    .drop-zone h3 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .drop-zone p {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .drop-zone .hint {
      margin-top: 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.7;
    }

    /* ── Summary cards ── */
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 900px) {
      .summary-cards { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 520px) {
      .summary-cards { grid-template-columns: 1fr; }
    }

    .stat-card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.35rem;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--card-accent, var(--accent));
    }

    .stat-card .label {
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .stat-card .value {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    /* ── Sections ── */
    section {
      margin-bottom: 2rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
    }

    .section-header h3 {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 600;
    }

    .section-header .badge {
      font-size: 0.72rem;
      color: var(--muted);
      background: var(--surface-solid);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    /* ── Monthly ── */
    .month-grid {
      display: grid;
      gap: 0.75rem;
    }

    .month-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .month-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      padding: 0.9rem 1.15rem;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
    }

    .month-card-header .month-name {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .month-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      justify-content: flex-end;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }

    .month-metrics span {
      color: var(--muted);
    }

    .month-metrics strong {
      color: var(--text);
      font-weight: 700;
    }

    .amount-charge { color: #f87171; }
    .amount-credit { color: #34d399; }
    .amount-net-neg { color: #f87171; }
    .amount-net-pos { color: #34d399; }

    .txn-amount { font-weight: 600; font-variant-numeric: tabular-nums; }

    .month-bars {
      padding: 0.85rem 1.15rem 1rem;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.55rem;
      font-size: 0.82rem;
    }

    .bar-row:last-child { margin-bottom: 0; }

    .bar-label {
      width: 8.5rem;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
    }

    .bar-track {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    .bar-amount {
      width: 4.5rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      font-size: 0.8rem;
    }

    /* ── Categories ── */
    .category-grid {
      display: grid;
      gap: 0.65rem;
    }

    .cat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .cat-card:hover {
      border-color: var(--border-strong);
    }

    .cat-card.unused {
      opacity: 0.55;
    }

    .cat-card.open {
      border-color: rgba(91, 141, 239, 0.25);
    }

    .cat-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1.1rem;
      cursor: pointer;
      user-select: none;
    }

    .cat-card.unused .cat-header {
      cursor: default;
    }

    .cat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .cat-info {
      flex: 1;
      min-width: 0;
    }

    .cat-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .cat-meta {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .cat-total {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
    }

    .cat-total.empty {
      color: var(--muted);
      font-weight: 500;
    }

    .cat-chevron {
      color: var(--muted);
      transition: transform 0.2s;
      font-size: 0.75rem;
    }

    .cat-card.open .cat-chevron {
      transform: rotate(180deg);
    }

    .cat-body {
      display: none;
      border-top: 1px solid var(--border);
    }

    .cat-card.open .cat-body {
      display: block;
    }

    .txn-row {
      display: grid;
      grid-template-columns: 5.5rem 1fr auto;
      gap: 0.5rem 0.75rem;
      padding: 0.6rem 1.1rem;
      font-size: 0.82rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: background 0.1s;
    }

    .txn-row:hover {
      background: rgba(255,255,255,0.02);
    }

    .txn-row:last-child { border-bottom: none; }

    .txn-date { color: var(--muted); font-variant-numeric: tabular-nums; }
    .txn-amount { font-weight: 600; font-variant-numeric: tabular-nums; }
    .txn-sub {
      grid-column: 2 / -1;
      color: var(--muted);
      font-size: 0.72rem;
      margin-top: -0.2rem;
    }

    .unused-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .unused-chip {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.7rem;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .unused-chip .cat-dot {
      width: 7px;
      height: 7px;
      opacity: 0.5;
    }

    /* ── Spending calendar ── */
    .calendar-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.35rem;
      margin-bottom: 2rem;
    }

    .calendar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .calendar-title-block .spent-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .calendar-title-block .spent-total {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-top: 0.15rem;
    }

    .calendar-month-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      margin-top: 0.65rem;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .calendar-month-stats strong {
      color: var(--text);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .calendar-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      .calendar-layout { grid-template-columns: 1fr; }
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.35rem;
      margin-bottom: 0.35rem;
    }

    .calendar-weekdays span {
      text-align: center;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.35rem;
    }

    .cal-day {
      aspect-ratio: 1;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      padding: 0.45rem 0.4rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.15rem;
      transition: border-color 0.15s, transform 0.1s;
      min-height: 58px;
    }

    .cal-day:hover:not(.cal-empty) {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .cal-day.cal-empty {
      border-color: transparent;
      background: transparent;
      cursor: default;
    }

    .cal-day.cal-selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .cal-day-num {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      align-self: flex-start;
    }

    .cal-day-amount {
      font-size: 0.78rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .cal-day-amount.empty {
      color: var(--muted);
      font-weight: 500;
      opacity: 0.45;
    }

    .calendar-side {
      display: flex;
      flex-direction: column;
    }

    .day-detail-panel {
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      flex: 1;
    }

    .panel-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .day-detail-header {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .day-detail-empty {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .side-txn {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--border);
    }

    .side-txn:last-child { border-bottom: none; }

    .side-txn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 0.35rem;
      flex-shrink: 0;
    }

    .side-txn-info { flex: 1; min-width: 0; }

    .side-txn-name {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .side-txn-meta {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    .side-txn-amount {
      font-size: 0.85rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .hidden { display: none !important; }

    .error {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: #fecaca;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: var(--muted);
      padding: 3rem;
      font-size: 0.9rem;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border-strong);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 860px) {
      .app { flex-direction: column; }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        max-height: 220px;
      }
      .main { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.9/babel.min.js" integrity="sha384-oLbIC13I/8DNBviftYPfOFQS5DC2WUmwk0SyIPmnzu1Ui+vYyATSSBJiJ5ETa4o/" crossorigin="anonymous"></script>

  {# JSX braces like style={{ ... }} clash with Jinja, so the app script is passed through raw. #}
  {% raw %}
  <script type="text/babel" data-presets="react">
    const { useState, useRef } = React;

    const money = (n) => "$" + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const signedMoney = (n) => {
      const value = money(n);
      if (n > 0) return "+" + value;
      if (n < 0) return "-" + value;
      return value;
    };
    const amountClass = (n) => {
      if (n > 0) return "amount-credit";
      if (n < 0) return "amount-charge";
      return "";
    };
    const netClass = (n) => (n > 0 ? "amount-net-pos" : n < 0 ? "amount-net-neg" : "");

    function shortName(name) {
      if (name.length <= 28) return name;
      return name.slice(0, 25) + "...";
    }

    function formatDayLabel(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    }

    function heatColor(total, maxTotal) {
      if (total <= 0) return "rgba(255,255,255,0.02)";
      const intensity = Math.min(total / maxTotal, 1);
      const alpha = 0.12 + intensity * 0.55;
      return `rgba(91, 141, 239, ${alpha})`;
    }

    const INITIAL_TITLE = "Upload transactions";
    const INITIAL_SUBTITLE = "Drop a CSV from any bank or budgeting app";

    // ── Icons ──
    function UploadIcon() {
      return (
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.5">
          <path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
        </svg>
      );
    }

    function DocumentIcon() {
      return (
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.5">
          <path strokeLinecap="round" strokeLinejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
        </svg>
      );
    }

    // Drag & drop target with the same depth counter as the old setupDropTarget().
    function useDropTarget(onDrop) {
      const [dragover, setDragover] = useState(false);
      const dragDepth = useRef(0);

      const handlers = {
        onDragEnter: (e) => {
          e.preventDefault();
          dragDepth.current++;
          setDragover(true);
        },
        onDragOver: (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "copy";
        },
        onDragLeave: () => {
          dragDepth.current--;
          if (dragDepth.current <= 0) {
            dragDepth.current = 0;
            setDragover(false);
          }
        },
        onDrop: (e) => {
          e.preventDefault();
          dragDepth.current = 0;
          setDragover(false);
          if (e.dataTransfer.files.length) onDrop(e.dataTransfer.files);
        },
      };

      return [dragover, handlers];
    }

    // ── Sidebar ──
    function FileItem({ entry, active, onSelect, onRemove }) {
      return (
        <div className={"file-item" + (active ? " active" : "")}>
          <div className="file-icon" onClick={onSelect}>📄</div>
          <div className="file-info" onClick={onSelect}>
            <div className="file-name" title={entry.name}>{shortName(entry.name)}</div>
            <div className="file-meta">{entry.data ? money(entry.data.spent_total ?? entry.data.grand_total) + " spent · " + entry.data.transaction_count + " txns" : "Loading..."}</div>
          </div>
          <button
            className="file-remove"
            title="Remove"
            onClick={(e) => {
              e.stopPropagation();
              onRemove();
            }}
          >×</button>
        </div>
      );
    }

    function CombinedItem({ active, combinedData, onSelect }) {
      const total = combinedData ? money(combinedData.spent_total ?? combinedData.grand_total) : "...";
      const count = combinedData ? combinedData.transaction_count + " txns" : "";
      return (
        <div className={"file-item combined" + (active ? " active" : "")} onClick={onSelect}>
          <div className="file-icon">📊</div>
          <div className="file-info">
            <div className="file-name">All combined</div>
            <div className="file-meta">{total}{count ? " spent · " + count : ""}</div>
          </div>
        </div>
      );
    }

    function Sidebar({ files, activeId, combinedData, onSelect, onRemove, onAddClick, onDropFiles }) {
      const [dragover, dropHandlers] = useDropTarget(onDropFiles);

      return (
        <aside className="sidebar">
          <div className="sidebar-header">
            <div className="logo">
              <div className="logo-icon">💳</div>
              <h1>Finance Organizer</h1>
            </div>
            <p>Works with Chase, BofA, Capital One &amp; more</p>
          </div>

          <div className={"file-list" + (dragover ? " dragover" : "")} id="fileList" {...dropHandlers}>
            <div className="sidebar-drop-overlay">
              <UploadIcon />
              <span>Drop CSV to add</span>
            </div>
            <div className={"sidebar-empty" + (files.length ? " hidden" : "")} id="sidebarEmpty">
              <DocumentIcon />
              <div>No files yet</div>
              <div className="drop-hint">Drag &amp; drop a CSV here</div>
            </div>

            {files.length > 0 && (
              <>
                <div className="file-list-label">Your files</div>
                {files.map(entry => (
                  <FileItem
                    key={entry.id}
                    entry={entry}
                    active={entry.id === activeId}
                    onSelect={() => onSelect(entry.id)}
                    onRemove={() => onRemove(entry.id)}
                  />
                ))}
                {files.length > 1 && (
                  <CombinedItem
                    active={activeId === "combined"}
                    combinedData={combinedData}
                    onSelect={() => onSelect("combined")}
                  />
                )}
                <div className="sidebar-drop-prompt">Drag &amp; drop another CSV here</div>
              </>
            )}
          </div>

          <div className="sidebar-footer">
            <button className="add-file-btn" id="addFileBtn" onClick={onAddClick}>
              <span>+</span> Add CSV file
            </button>
          </div>
        </aside>
      );
    }

    // ── Results ──

    // Expandable card; clicking the header toggles "open" like the old inline onclick.
    function CatCard({ defaultOpen, header, children, ...attrs }) {
      const [open, setOpen] = useState(defaultOpen);
      return (
        <div className={"cat-card" + (open ? " open" : "")} {...attrs}>
          <div className="cat-header" onClick={() => setOpen(o => !o)}>
            {header}
          </div>
          <div className="cat-body">
            {children}
          </div>
        </div>
      );
    }

    function SideTxn({ t }) {
      return (
        <div className="side-txn">
          <div className="side-txn-dot" style={{ background: t.color || "#64748b" }}></div>
          <div className="side-txn-info">
            <div className="side-txn-name">{t.description}</div>
            <div className="side-txn-meta">{t.category}{t.is_credit ? " · Credit" : ""}{t.account ? " · " + t.account : ""}</div>
          </div>
          <div className={`side-txn-amount ${amountClass(t.amount)}`}>{signedMoney(t.amount)}</div>
        </div>
      );
    }

    function DayDetail({ cal, selectedDate }) {
      const day = cal.days.find(d => d.date === selectedDate);
      if (!day || day.count === 0) {
        return (
          <>
            <div className="panel-label">Day details</div>
            <div className="day-detail-header">{formatDayLabel(selectedDate)}</div>
            <div className="day-detail-empty">No spending on this day.</div>
          </>
        );
      }
      return (
        <>
          <div className="panel-label">Day details</div>
          <div className="day-detail-header">{formatDayLabel(day.date)}</div>
          <div className="calendar-month-stats" style={{ margin: "0 0 0.75rem" }}>
            <span>Spent <strong>{money(day.spent)}</strong></span>
            {day.credits ? <span>Credits <strong className="amount-credit">{signedMoney(day.credits)}</strong></span> : null}
            <span>Net <strong className={netClass(day.net)}>{signedMoney(day.net)}</strong></span>
          </div>
          {day.transactions.map((t, i) => <SideTxn key={i} t={t} />)}
        </>
      );
    }

    function SpendingCalendar({ cal, index }) {
      // Defaults to the latest day with spending, else the first day of the month.
      const [selectedDate, setSelectedDate] = useState(() => {
        const withSpend = [...cal.days].reverse().find(d => d.count > 0);
        return withSpend ? withSpend.date : cal.days[0].date;
      });
      const maxDayTotal = Math.max(...cal.days.map(d => d.total), 1);
      const calNet = cal.net ?? -(cal.spent ?? cal.total);

      const cells = [];
      for (let i = 0; i < cal.first_weekday; i++) {
        cells.push(<div key={"empty-" + i} className="cal-day cal-empty"></div>);
      }
      for (const day of cal.days) {
        const isSelected = day.date === selectedDate;
        cells.push(
          <div
            key={day.date}
            className={"cal-day" + (isSelected ? " cal-selected" : "")}
            data-date={day.date}
            style={{ background: heatColor(day.total, maxDayTotal) }}
            onClick={() => setSelectedDate(day.date)}
          >
            <span className="cal-day-num">{day.day}</span>
            <span className={"cal-day-amount" + (day.total > 0 ? "" : " empty")}>{day.total > 0 ? money(day.total) : "—"}</span>
          </div>
        );
      }

      return (
        <section className="calendar-section">
          <div className="calendar-top">
            <div className="calendar-title-block">
              <div className="spent-label">Spent in {cal.short_label}</div>
              <div className="spent-total">{money(cal.spent ?? cal.total)}</div>
              <div className="calendar-month-stats">
                <span>Credits <strong className="amount-credit">{signedMoney(cal.credits || 0)}</strong></span>
                <span>Net <strong className={netClass(calNet)}>{signedMoney(calNet)}</strong></span>
              </div>
            </div>
          </div>
          <div className="calendar-layout">
            <div>
              <div className="calendar-weekdays">
                <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
                <span>Thu</span><span>Fri</span><span>Sat</span>
              </div>
              <div className="calendar-grid" id={`calendarGrid-${index}`}>
                {cells}
              </div>
            </div>
            <div className="calendar-side">
              <div className="day-detail-panel" id={`dayDetail-${index}`}>
                <DayDetail cal={cal} selectedDate={selectedDate} />
              </div>
            </div>
          </div>
        </section>
      );
    }

    const Results = React.memo(function Results({ data }) {
      const maxMonthTotal = Math.max(...data.monthly.map(m => m.spent ?? m.total), 1);
      const net = data.net_total ?? -(data.spent_total ?? data.grand_total);

      return (
        <>
          <div className="summary-cards">
            <div className="stat-card" style={{ "--card-accent": "#f87171" }}>
              <div className="label">Total Spent</div>
              <div className="value">{money(data.spent_total ?? data.grand_total)}</div>
            </div>
            <div className="stat-card" style={{ "--card-accent": "#34d399" }}>
              <div className="label">Credits / Refunds</div>
              <div className="value">{signedMoney(data.credits_total || 0)}</div>
            </div>
            <div className="stat-card" style={{ "--card-accent": "#5b8def" }}>
              <div className="label">Net</div>
              <div className={`value ${netClass(net)}`}>{signedMoney(net)}</div>
            </div>
            <div className="stat-card" style={{ "--card-accent": "#a78bfa" }}>
              <div className="label">Charges</div>
              <div className="value">{data.charge_count ?? data.transaction_count}</div>
            </div>
          </div>

          <section>
            <div className="section-header">
              <h3>Monthly Summary</h3>
            </div>
            <div className="month-grid">
              {data.monthly.map((m, mi) => {
                const monthNet = m.net ?? -(m.spent ?? m.total);
                return (
                  <div className="month-card" key={mi}>
                    <div className="month-card-header">
                      <span className="month-name">{m.month}</span>
                      <div className="month-metrics">
                        <span>Spent <strong>{money(m.spent ?? m.total)}</strong></span>
                        <span>Credits <strong className="amount-credit">{signedMoney(m.credits || 0)}</strong></span>
                        <span>Net <strong className={netClass(monthNet)}>{signedMoney(monthNet)}</strong></span>
                      </div>
                    </div>
                    <div className="month-bars">
                      {m.categories.map((c, ci) => (
                        <div className="bar-row" key={ci}>
                          <span className="bar-label">{c.category}</span>
                          <div className="bar-track">
                            <div className="bar-fill" style={{ width: `${(c.total / maxMonthTotal * 100).toFixed(1)}%`, background: c.color }}></div>
                          </div>
                          <span className="bar-amount">{money(c.total)}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </section>

          <section>
            <div className="section-header">
              <h3>Charges by Category</h3>
              <span className="badge">Negative amounts</span>
            </div>
            <div className="category-grid">
              {data.categories.map((cat, i) => (
                <CatCard
                  key={i}
                  defaultOpen={i === 0}
                  data-cat=""
                  header={
                    <>
                      <div className="cat-dot" style={{ background: cat.color }}></div>
                      <div className="cat-info">
                        <div className="cat-name">{cat.name}</div>
                        <div className="cat-meta">{cat.count} charge{cat.count !== 1 ? "s" : ""}</div>
                      </div>
                      <span className="cat-total amount-charge">-{money(cat.total)}</span>
                      <span className="cat-chevron">▼</span>
                    </>
                  }
                >
                  {cat.transactions.map((t, ti) => (
                    <div className="txn-row" key={ti}>
                      <span className="txn-date">{t.date}</span>
                      <span>{t.description}</span>
                      <span className={`txn-amount ${amountClass(t.amount)}`}>{signedMoney(t.amount)}</span>
                      {t.account || t.source ? <span className="txn-sub">{[t.account, t.source].filter(Boolean).join(" · ")}</span> : null}
                    </div>
                  ))}
                </CatCard>
              ))}
            </div>
          </section>

          {data.credits && data.credits.length ? (
            <section>
              <div className="section-header">
                <h3>Credits &amp; Refunds</h3>
                <span className="badge">Positive amounts · {signedMoney(data.credits_total || 0)}</span>
              </div>
              <div className="category-grid">
                <CatCard
                  defaultOpen={true}
                  header={
                    <>
                      <div className="cat-dot" style={{ background: "#34d399" }}></div>
                      <div className="cat-info">
                        <div className="cat-name">Incoming credits</div>
                        <div className="cat-meta">{data.credit_count} transaction{data.credit_count !== 1 ? "s" : ""}</div>
                      </div>
                      <span className="cat-total amount-credit">{signedMoney(data.credits_total || 0)}</span>
                      <span className="cat-chevron">▼</span>
                    </>
                  }
                >
                  {data.credits.map((t, ti) => (
                    <div className="txn-row" key={ti}>
                      <span className="txn-date">{t.date}</span>
                      <span>{t.description}</span>
                      <span className="txn-amount amount-credit">{signedMoney(t.amount)}</span>
                      <span className="txn-sub">{[t.category, t.account, t.source].filter(Boolean).join(" · ")}</span>
                    </div>
                  ))}
                </CatCard>
              </div>
            </section>
          ) : null}

          {data.unused_categories && data.unused_categories.length ? (
            <section>
              <div className="section-header">
                <h3>Other Categories</h3>
                <span className="badge">Not used this period</span>
              </div>
              <div className="unused-grid">
                {data.unused_categories.map((cat, i) => (
                  <div className="unused-chip" key={i}>
                    <div className="cat-dot" style={{ background: cat.color }}></div>
                    {cat.name}
                  </div>
                ))}
              </div>
            </section>
          ) : null}

          {(data.calendars || []).map((cal, i) => (
            <SpendingCalendar key={i} cal={cal} index={i} />
          ))}
        </>
      );
    });

    // ── App ──
    function App() {
      // The same mutable model the original script kept in top-level variables. It lives in a ref,
      // not state, because the async upload and re-analyze loops read the latest values after each await.
      const store = useRef({ files: [], activeId: null, combinedData: null, nextId: 1 }).current;
      const expensesOnlyRef = useRef(true);
      const renderCount = useRef(0);
      const fileInputRef = useRef(null);

      // What is on screen. It changes only where the original script updated the DOM.
      const [sidebar, setSidebar] = useState({ files: [], activeId: null, combinedData: null });
      const [header, setHeader] = useState({ title: INITIAL_TITLE, subtitle: INITIAL_SUBTITLE });
      const [view, setView] = useState(null);
      const [resultsHidden, setResultsHidden] = useState(true);
      const [dropZoneHidden, setDropZoneHidden] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [expensesOnly, setExpensesOnly] = useState(true);
      const [dropZoneDragover, dropZoneHandlers] = useDropTarget(addFiles);

      function showError(msg) {
        setError(msg);
      }

      function clearError() {
        setError(null);
      }

      function renderSidebar() {
        setSidebar({
          files: store.files.map(({ id, name, data }) => ({ id, name, data })),
          activeId: store.activeId,
          combinedData: store.combinedData,
        });
      }

      async function analyzeFile(file) {
        const form = new FormData();
        form.append("file", file);
        form.append("expenses_only", expensesOnlyRef.current ? "true" : "false");
        const res = await fetch("/api/analyze", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Analysis failed");
        return data;
      }

      async function analyzeCombined() {
        const form = new FormData();
        store.files.forEach(entry => form.append("files", entry.file));
        form.append("expenses_only", expensesOnlyRef.current ? "true" : "false");
        const res = await fetch("/api/analyze-multiple", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Analysis failed");
        return data;
      }

      async function addFiles(fileList) {
        clearError();
        const csvFiles = [...fileList].filter(f => f.name.toLowerCase().endsWith(".csv"));
        if (!csvFiles.length) {
          showError("Please upload .csv files only.");
          return;
        }

        const isFirstUpload = store.files.length === 0;

        setLoading(true);
        if (isFirstUpload) {
          setResultsHidden(true);
          setDropZoneHidden(true);
        }

        try {
          for (const file of csvFiles) {
            if (store.files.some(entry => entry.name === file.name)) continue;

            const id = store.nextId++;
            const entry = { id, name: file.name, file, data: null };
            store.files.push(entry);
            renderSidebar();
            entry.data = await analyzeFile(file);
            renderSidebar();
            selectFile(id);
          }

          if (store.files.length > 1) {
            store.combinedData = await analyzeCombined();
            if (store.activeId === "combined") renderResults(store.combinedData, "All combined");
            renderSidebar();
          }
        } catch (err) {
          showError(err.message);
        } finally {
          setLoading(false);
        }
      }

      function removeFile(id) {
        store.files = store.files.filter(f => f.id !== id);
        if (store.activeId === id) {
          store.activeId = store.files.length ? store.files[0].id : null;
          if (store.files.length > 1) store.combinedData = null;
        }
        if (store.files.length <= 1) {
          store.combinedData = null;
          if (store.activeId === "combined") store.activeId = store.files[0]?.id || null;
        }
        if (store.files.length === 0) {
          store.activeId = null;
          store.combinedData = null;
          setResultsHidden(true);
          setDropZoneHidden(false);
          setHeader({ title: INITIAL_TITLE, subtitle: INITIAL_SUBTITLE });
        } else {
          refreshCombined().then(() => {
            if (store.activeId === "combined" && store.combinedData) {
              renderResults(store.combinedData, "All combined");
            } else if (store.activeId) {
              const entry = store.files.find(f => f.id === store.activeId);
              if (entry?.data) renderResults(entry.data, entry.name);
            }
            renderSidebar();
          });
        }
        renderSidebar();
      }

      async function refreshCombined() {
        if (store.files.length > 1) {
          try {
            store.combinedData = await analyzeCombined();
          } catch { store.combinedData = null; }
        } else {
          store.combinedData = null;
        }
      }

      function selectFile(id) {
        store.activeId = id;
        renderSidebar();
        if (id === "combined" && store.combinedData) {
          renderResults(store.combinedData, "All combined");
        } else {
          const entry = store.files.find(f => f.id === id);
          if (entry?.data) renderResults(entry.data, entry.name);
        }
      }

      // Every call re-mounts the results (new key), resetting expanded categories and
      // calendar selections the same way rewriting innerHTML did.
      function renderResults(data, title) {
        setHeader({
          title: shortName(title),
          subtitle: `${data.charge_count ?? data.transaction_count} charges · ${data.credit_count || 0} credits · ${data.categories.length} categories`,
        });
        renderCount.current += 1;
        setView({ data, key: renderCount.current });
        setResultsHidden(false);
      }

      async function exportExcel() {
        if (!store.files.length) return;
        clearError();

        const form = new FormData();
        const toExport = store.activeId === "combined" ? store.files : store.files.filter(f => f.id === store.activeId);
        toExport.forEach(entry => form.append("files", entry.file));
        form.append("expenses_only", expensesOnlyRef.current ? "true" : "false");

        try {
          const res = await fetch("/api/export-excel", { method: "POST", body: form });
          if (!res.ok) {
            const data = await res.json();
            throw new Error(data.error || "Export failed");
          }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          const name = store.activeId === "combined"
            ? "combined_transactions_organized.xlsx"
            : toExport[0].name.replace(/\.csv$/i, "") + "_organized.xlsx";
          a.download = name;
          a.click();
          URL.revokeObjectURL(url);
        } catch (err) {
          showError(err.message);
        }
      }

      async function reanalyzeAll() {
        if (!store.files.length) return;
        setLoading(true);
        clearError();
        try {
          for (const entry of store.files) {
            entry.data = await analyzeFile(entry.file);
          }
          if (store.files.length > 1) store.combinedData = await analyzeCombined();
          renderSidebar();
          selectFile(store.activeId || store.files[0].id);
        } catch (err) {
          showError(err.message);
        } finally {
          setLoading(false);
        }
      }

      function openFilePicker() {
        fileInputRef.current.click();
      }

      function onFileInputChange(e) {
        if (e.target.files.length) addFiles(e.target.files);
        e.target.value = "";
      }

      function onExpensesOnlyChange(e) {
        expensesOnlyRef.current = e.target.checked;
        setExpensesOnly(e.target.checked);
        reanalyzeAll();
      }

      return (
        <div className="app">
          <Sidebar
            files={sidebar.files}
            activeId={sidebar.activeId}
            combinedData={sidebar.combinedData}
            onSelect={selectFile}
            onRemove={removeFile}
            onAddClick={openFilePicker}
            onDropFiles={addFiles}
          />

          <main className="main">
            <div className="main-header">
              <div>
                <h2 id="viewTitle">{header.title}</h2>
                <p className="subtitle" id="viewSubtitle">{header.subtitle}</p>
              </div>
              <div className="header-actions">
                <label className="checkbox">
                  <input type="checkbox" id="expensesOnly" checked={expensesOnly} onChange={onExpensesOnlyChange} />
                  Expenses only (hide transfers &amp; payments)
                </label>
                <button className="btn btn-primary" id="exportBtn" disabled={sidebar.files.length === 0} onClick={exportExcel}>Export Excel</button>
              </div>
            </div>

            <div
              className={"drop-zone" + (dropZoneHidden ? " hidden" : "") + (dropZoneDragover ? " dragover" : "")}
              id="dropZone"
              onClick={openFilePicker}
              {...dropZoneHandlers}
            >
              <div className="dz-icon">
                <UploadIcon />
              </div>
              <h3>Drag &amp; drop your CSV here</h3>
              <p>Chase, Bank of America, Capital One, Amex, Monarch, Mint &amp; more</p>
              <p className="hint">Add multiple files — they'll appear in the sidebar</p>
              <input type="file" id="fileInput" accept=".csv" multiple hidden ref={fileInputRef} onChange={onFileInputChange} />
            </div>

            <div id="error" className={"error" + (error === null ? " hidden" : "")}>{error}</div>
            <div id="loading" className={"loading" + (loading ? "" : " hidden")}>
              <div className="spinner"></div>
              <span>Analyzing transactions...</span>
            </div>
            <div id="results" className={resultsHidden ? "hidden" : ""}>
              {view && <Results key={view.key} data={view.data} />}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  {% endraw %}
</body>
</html>
